<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reading Speed | Script Work Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:wght@300;400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&family=Lexend:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* Dyslexia-friendly typeface, self-hosted via the Fontsource/jsDelivr CDN (free, SIL-OFL licensed) */
  @font-face{
    font-family:'OpenDyslexic';
    font-style:normal;
    font-display:swap;
    font-weight:400;
    src:url(https://cdn.jsdelivr.net/fontsource/fonts/opendyslexic@5.3.0/latin-400-normal.woff2) format('woff2');
  }
  @font-face{
    font-family:'OpenDyslexic';
    font-style:normal;
    font-display:swap;
    font-weight:700;
    src:url(https://cdn.jsdelivr.net/fontsource/fonts/opendyslexic@5.3.0/latin-700-normal.woff2) format('woff2');
  }

  :root{
    --navy:#0d1b2a;
    --deep:#162032;
    --mid:#1e3a5f;
    --accent:#4a8fd4;
    --accent2:#6bb3f0;
    --text:#e8f0f8;
    --muted:#8aa8c8;
    --card-bg:rgba(30, 58, 95, 0.35);
    --border:rgba(74, 143, 212, 0.2);
    --display:'Syne', sans-serif;
    --chrome:'DM Sans', -apple-system, sans-serif;
    --serif:'Source Serif 4', Georgia, serif;
    --reading-font:var(--chrome);
  }

  *{ box-sizing:border-box; }
  html,body{ height:100%; }

  body{
    margin:0;
    background:var(--navy);
    color:var(--text);
    font-family:var(--chrome);
    font-weight:300;
    -webkit-font-smoothing:antialiased;
    position:relative;
    overflow-x:hidden;
  }

  body::before{
    content:'';
    position:fixed;
    inset:0;
    background-image:
      linear-gradient(rgba(74,143,212,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(74,143,212,0.04) 1px, transparent 1px);
    background-size:60px 60px;
    pointer-events:none;
    z-index:0;
  }
  body::after{
    content:'';
    position:fixed;
    top:-200px;
    right:-200px;
    width:600px;
    height:600px;
    background:radial-gradient(circle, rgba(74,143,212,0.12) 0%, transparent 70%);
    pointer-events:none;
    z-index:0;
  }

  *:focus-visible{ outline:2px solid var(--accent2); outline-offset:3px; }

  .app{
    max-width:640px;
    margin:0 auto;
    min-height:100vh;
    padding:1.75rem 1.5rem 2rem;
    display:flex;
    flex-direction:column;
    position:relative;
    z-index:1;
  }

  .brand-bar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:1rem;
    padding-top:1.5rem;
    margin-top:2.25rem;
    border-top:1px solid var(--border);
  }
  .brand-bar .logo{ height:46px; width:auto; display:block; }

  header{ margin-bottom:1.85rem; }

  header h1{
    font-family:var(--display);
    font-weight:800;
    font-size:clamp(2.1rem, 8vw, 3.2rem);
    line-height:1.05;
    margin:0 0 0.4rem;
    background:linear-gradient(135deg, var(--text) 0%, var(--accent2) 100%);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    background-clip:text;
  }

  header p{
    margin:0;
    font-size:0.85rem;
    color:var(--muted);
    font-weight:400;
  }

  .stage{
    flex:1;
    display:flex;
    flex-direction:column;
    justify-content:center;
    min-height:34vh;
  }

  /* ---------- Setup screen ---------- */

  #setup-screen textarea{
    width:100%;
    min-height:190px;
    background:var(--card-bg);
    border:1px solid var(--border);
    border-radius:10px;
    color:var(--text);
    font-family:var(--reading-font);
    font-size:1.05rem;
    line-height:1.6;
    padding:1rem;
    resize:vertical;
    transition:border-color .15s ease;
  }

  #setup-screen textarea:focus{
    border-color:var(--accent);
    outline:none;
  }

  #setup-screen textarea::placeholder{ color:var(--muted); opacity:0.6; }

  .setup-meta{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:1rem;
    margin-top:0.65rem;
    font-size:0.8rem;
    color:var(--muted);
  }

  .sample-select{
    background:var(--card-bg);
    border:1px solid var(--border);
    color:var(--text);
    font-family:var(--chrome);
    font-size:0.78rem;
    padding:0.35rem 1.6rem 0.35rem 0.6rem;
    border-radius:6px;
    appearance:none;
    -webkit-appearance:none;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M0 0l5 6 5-6z' fill='%238aa8c8'/></svg>");
    background-repeat:no-repeat;
    background-position:right 0.6rem center;
    cursor:pointer;
  }

  .word-count{ flex:0 0 auto; }

  /* ---------- Reading screen ---------- */

  #reader-screen{ display:none; }

  .word-stage{
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:34vh;
  }

  .tick{ position:absolute; left:50%; width:1px; height:12px; background:var(--border); }
  .tick.top{ top:calc(50% - 48px); }
  .tick.bottom{ bottom:calc(50% - 48px); }

  .word-display{
    width:min(88vw, 560px);
    display:flex;
    align-items:baseline;
    justify-content:center;
    font-family:var(--reading-font);
    font-weight:500;
    font-size:clamp(2.1rem, 7.5vw, 3.8rem);
    white-space:pre;
    line-height:1.15;
  }

  .word-display .pre{ flex:1 1 0; text-align:right; overflow:hidden; }
  .word-display .post{ flex:1 1 0; text-align:left; overflow:hidden; }
  .word-display .pivot{ flex:0 0 auto; min-width:1ch; text-align:center; color:var(--accent2); }
  .word-display .pivot-plain{ flex:0 0 auto; color:var(--text); }

  .beat{ width:5px; height:5px; border-radius:50%; background:var(--accent); margin:0.9rem auto 0; }
  .beat.pulse{ animation:pulse .2s ease-out; }
  @keyframes pulse{
    0%{ background:var(--accent2); box-shadow:0 0 6px var(--accent2); }
    100%{ background:var(--accent); box-shadow:none; }
  }

  .progress-wrap{ margin-top:1.25rem; }
  .progress-track{ height:2px; background:var(--border); border-radius:1px; overflow:hidden; }
  .progress-fill{ height:100%; width:0%; background:var(--accent2); transition:width .12s linear; }
  .progress-meta{
    display:flex;
    justify-content:space-between;
    font-size:0.75rem;
    color:var(--muted);
    margin-top:0.5rem;
    font-variant-numeric:tabular-nums;
  }

  /* ---------- Results screen ---------- */

  #results-screen{ display:none; text-align:center; }

  .result-number{
    font-family:var(--display);
    font-weight:800;
    font-size:clamp(2.8rem, 12vw, 4.6rem);
    line-height:1;
    background:linear-gradient(135deg, var(--text) 0%, var(--accent2) 100%);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    background-clip:text;
  }
  .result-label{ font-size:0.85rem; color:var(--muted); margin-top:0.35rem; }
  .result-stats{
    margin-top:1.75rem;
    display:flex;
    justify-content:center;
    gap:2.25rem;
    font-size:0.8rem;
    color:var(--muted);
  }
  .result-stats strong{
    display:block;
    color:var(--text);
    font-size:1rem;
    font-weight:500;
    font-variant-numeric:tabular-nums;
  }
  .result-actions{ margin-top:2.25rem; display:flex; justify-content:center; gap:1.75rem; }
  .result-actions button{
    background:none;
    border:none;
    padding:0;
    color:var(--accent2);
    font-family:var(--chrome);
    font-size:0.85rem;
    cursor:pointer;
    border-bottom:1px solid transparent;
  }
  .result-actions button:hover{ border-bottom-color:var(--accent2); }

  /* ---------- Console (card, matches project-card styling) ---------- */

  .console{
    margin-top:1.75rem;
    background:var(--card-bg);
    border:1px solid var(--border);
    border-radius:16px;
    padding:1.5rem 1.75rem;
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    row-gap:1.25rem;
    column-gap:1.75rem;
  }
  .console.is-hidden{ display:none; }

  .play-btn{
    flex:0 0 auto;
    width:52px;
    height:52px;
    border-radius:50%;
    border:1px solid var(--accent);
    background:transparent;
    color:var(--accent2);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    transition:background-color .15s ease, color .15s ease;
  }
  .play-btn:hover{ background:var(--accent2); color:var(--navy); }
  .play-btn svg{ width:18px; height:18px; }
  .play-btn .icon-pause{ display:none; }
  .play-btn.is-playing .icon-play{ display:none; }
  .play-btn.is-playing .icon-pause{ display:block; }

  .tempo{ flex:1 1 220px; min-width:0; }
  .tempo-row{ display:flex; align-items:baseline; gap:0.4rem; margin-bottom:0.4rem; }
  .tempo-value{ font-size:1.3rem; font-variant-numeric:tabular-nums; color:var(--text); }
  .tempo-unit{ font-size:0.75rem; color:var(--muted); }
  .tempo-name{ font-size:0.75rem; color:var(--accent2); margin-left:auto; }
  input[type="range"]{
    -webkit-appearance:none;
    appearance:none;
    width:100%;
    height:2px;
    background:var(--border);
    border-radius:2px;
    outline:none;
  }
  input[type="range"]::-webkit-slider-thumb{
    -webkit-appearance:none;
    width:13px;
    height:13px;
    border-radius:50%;
    background:var(--accent2);
    cursor:pointer;
    margin-top:-1px;
  }
  input[type="range"]::-moz-range-thumb{
    width:13px; height:13px; border:none; border-radius:50%; background:var(--accent2); cursor:pointer;
  }

  .chunk-toggle, .font-toggle{
    flex:0 0 auto;
    display:flex;
    flex-direction:column;
    gap:0.4rem;
    align-items:flex-start;
  }
  .chunk-toggle .ctrl-label, .font-toggle .ctrl-label{ font-size:0.7rem; color:var(--muted); }
  .chunk-buttons{ display:flex; gap:0.75rem; }
  .chunk-buttons button{
    background:none;
    border:none;
    padding:0 0 0.15rem;
    color:var(--muted);
    font-family:var(--chrome);
    font-size:0.8rem;
    border-bottom:2px solid transparent;
    cursor:pointer;
  }
  .chunk-buttons button.active{ color:var(--text); border-bottom-color:var(--accent2); }
  .chunk-toggle.is-disabled{ opacity:0.4; pointer-events:none; }

  .font-select{
    background:var(--deep);
    border:1px solid var(--border);
    color:var(--text);
    font-size:0.8rem;
    padding:0.3rem 1.6rem 0.3rem 0.55rem;
    border-radius:6px;
    appearance:none;
    -webkit-appearance:none;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M0 0l5 6 5-6z' fill='%238aa8c8'/></svg>");
    background-repeat:no-repeat;
    background-position:right 0.55rem center;
    cursor:pointer;
    min-width:150px;
  }
  .font-select option{ background:var(--deep); color:var(--text); }

  .hint{ margin-top:1.25rem; font-size:0.72rem; color:var(--muted); text-align:center; opacity:0.7; }

  .bmc-btn{
    display:inline-flex;
    align-items:center;
    gap:0.5rem;
    background:#FFDD00;
    color:#000000;
    font-family:var(--chrome);
    font-weight:600;
    font-size:0.85rem;
    padding:0.55rem 1.2rem;
    border-radius:8px;
    text-decoration:none;
    transition:opacity .2s ease;
  }
  .bmc-btn:hover{ opacity:0.85; }

  @media (max-width:560px){
    .tempo{ flex:1 1 100%; order:3; }
    .chunk-toggle{ order:2; }
    .font-toggle{ order:2; }
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation:none !important; transition:none !important; }
  }
</style>
</head>
<body class="font-sans">
<div class="app">

  <header>
    <h1>Reading Speed</h1>
    <p>By Script Work Studio</p>
  </header>

  <div class="stage">

    <!-- Setup -->
    <section id="setup-screen">
      <textarea id="text-input" placeholder="Paste or type the text you want to practice with…"></textarea>
      <div class="setup-meta">
        <select class="sample-select" id="sample-select" aria-label="Choose a starter text">
          <option value="" selected>Choose a starter text…</option>
          <option value="easy">Easy</option>
          <option value="medium">Medium</option>
          <option value="hard">Hard</option>
        </select>
        <span class="word-count" id="setup-count">0 words</span>
      </div>
    </section>

    <!-- Reading -->
    <section id="reader-screen">
      <div class="word-stage">
        <span class="tick top"></span>
        <div class="word-display" id="word-display" aria-live="off"></div>
        <span class="tick bottom"></span>
      </div>
      <div class="beat" id="beat"></div>
      <div class="progress-wrap">
        <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
        <div class="progress-meta">
          <span id="progress-count">0 / 0 words</span>
          <span>Space to pause · Esc to stop</span>
        </div>
      </div>
    </section>

    <!-- Results -->
    <section id="results-screen">
      <div class="result-number" id="result-wpm">0</div>
      <div class="result-label">words per minute</div>
      <div class="result-stats">
        <div><strong id="result-words">0</strong>words read</div>
        <div><strong id="result-time">0:00</strong>time</div>
      </div>
      <div class="result-actions">
        <button id="read-again-btn" type="button">Read again</button>
        <button id="new-text-btn" type="button">Start over with new text</button>
      </div>
    </section>

  </div>

  <div class="console" id="console">
    <button class="play-btn" id="play-btn" type="button" aria-label="Begin reading">
      <svg class="icon-play" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      <svg class="icon-pause" viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
    </button>

    <div class="tempo">
      <div class="tempo-row">
        <span class="tempo-value" id="tempo-value">80</span>
        <span class="tempo-unit">wpm</span>
        <span class="tempo-name" id="tempo-name">Andante</span>
      </div>
      <input type="range" id="wpm-slider" min="20" max="400" step="5" value="80" aria-label="Reading speed in words per minute">
    </div>

    <div class="chunk-toggle" id="chunk-toggle">
      <span class="ctrl-label">Words per flash</span>
      <div class="chunk-buttons">
        <button type="button" data-size="1" class="active">1</button>
        <button type="button" data-size="2">2</button>
        <button type="button" data-size="3">3</button>
      </div>
    </div>

    <div class="font-toggle">
      <span class="ctrl-label">Font</span>
      <select class="font-select" id="font-select" aria-label="Reading font">
        <option value="sans" selected>Sans-serif</option>
        <option value="serif">Serif</option>
        <option value="lexend">Easy-read (Lexend)</option>
        <option value="dyslexic">Dyslexia-friendly</option>
      </select>
    </div>
  </div>

  <p class="hint">Once you start, the WPM slider still works — nudge it up or down mid-read to find your pace.</p>

<script>
(function(){
  "use strict";

  var SAMPLE_TEXTS = {
    easy: "Milo the cat likes to sit on the wall. He watches the birds fly by. One day, a red ball rolls past. Milo jumps down and chases it. The ball rolls under a bush. Milo pokes his paw in and pulls it out. He rolls the ball all the way home.",
    medium: "On Saturday morning, Priya and her little brother Sam packed a bag for the beach. They took towels, a bucket, a spade, and a bag of sandwiches. The bus ride took twenty minutes, and Sam pressed his nose against the window the whole way, watching the fields turn into sand dunes. When they arrived, the tide was out, leaving smooth, wet sand perfect for digging. Priya started building a castle with three towers while Sam collected shells in his bucket. By lunchtime, their castle had a moat, a bridge, and a flag made from a lolly stick. The sea slowly crept closer, and they cheered when the first wave reached the moat.",
    hard: "Long before satellites and weather apps, sailors relied on careful observation to predict what the sky had planned for them. A ring around the moon often meant rain was on its way, caused by thin clouds of ice crystals drifting high above the earth. A red sky at sunset, sailors believed, promised calmer weather the next day, while a red sky at dawn was treated as a warning. These sayings were not just superstition; many were built on genuine patterns that scientists can now explain using our understanding of air pressure and moisture. Modern forecasting still values these old observations, even though today's meteorologists use satellites, weather balloons, and powerful computer models instead of simply glancing at the horizon. Next time you notice an unusual sunset or a hazy ring around the moon, take a moment to look closer. You might be reading a forecast that people have trusted for thousands of years."
  };

  var els = {
    setupScreen: document.getElementById('setup-screen'),
    readerScreen: document.getElementById('reader-screen'),
    resultsScreen: document.getElementById('results-screen'),
    textInput: document.getElementById('text-input'),
    setupCount: document.getElementById('setup-count'),
    sampleSelect: document.getElementById('sample-select'),
    wordDisplay: document.getElementById('word-display'),
    beat: document.getElementById('beat'),
    progressFill: document.getElementById('progress-fill'),
    progressCount: document.getElementById('progress-count'),
    resultWpm: document.getElementById('result-wpm'),
    resultWords: document.getElementById('result-words'),
    resultTime: document.getElementById('result-time'),
    readAgainBtn: document.getElementById('read-again-btn'),
    newTextBtn: document.getElementById('new-text-btn'),
    console: document.getElementById('console'),
    playBtn: document.getElementById('play-btn'),
    wpmSlider: document.getElementById('wpm-slider'),
    tempoValue: document.getElementById('tempo-value'),
    tempoName: document.getElementById('tempo-name'),
    chunkToggle: document.getElementById('chunk-toggle'),
    chunkButtons: document.querySelectorAll('.chunk-buttons button'),
    fontSelect: document.getElementById('font-select'),
    body: document.body
  };

  var state = {
    screen: 'setup',
    sequence: [],
    index: 0,
    totalWords: 0,
    wordsSoFar: 0,
    playing: false,
    wpm: 80,
    chunkSize: 1,
    timerId: null,
    activeMs: 0,
    lastResume: 0
  };

  function escapeHtml(str){
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function tempoLabel(wpm){
    if (wpm < 50) return 'Larghetto';
    if (wpm < 90) return 'Andante';
    if (wpm < 140) return 'Moderato';
    if (wpm < 200) return 'Allegro';
    if (wpm < 280) return 'Presto';
    return 'Prestissimo';
  }

  function countWords(str){
    var t = str.trim();
    if (!t) return 0;
    return t.split(/\s+/).length;
  }

  function formatDuration(minutes){
    var totalSeconds = Math.round(minutes * 60);
    if (totalSeconds < 60) return '0:' + String(totalSeconds).padStart(2, '0');
    var m = Math.floor(totalSeconds / 60);
    var s = totalSeconds % 60;
    return m + ':' + String(s).padStart(2, '0');
  }

  function estimateReadTime(words, wpm){
    var min = words / wpm;
    if (min < 1) return Math.max(1, Math.round(min * 60)) + ' sec';
    return (min < 10 ? min.toFixed(1) : Math.round(min)) + ' min';
  }

  function updateSetupMeta(){
    var n = countWords(els.textInput.value);
    var text = n + (n === 1 ? ' word' : ' words');
    if (n > 0) text += ' · about ' + estimateReadTime(n, state.wpm) + ' at ' + state.wpm + ' wpm';
    els.setupCount.textContent = text;
  }

  function splitPivot(word){
    var len = word.length;
    var idx;
    if (len <= 1) idx = 0;
    else if (len <= 4) idx = 1;
    else if (len <= 9) idx = 2;
    else if (len <= 13) idx = 3;
    else idx = 4;
    if (idx >= len) idx = len - 1;
    return { pre: word.slice(0, idx), pivot: word.charAt(idx), post: word.slice(idx + 1) };
  }

  function buildSequence(raw, chunkSize){
    var words = raw.trim().split(/\s+/).filter(Boolean);
    var seq = [];
    for (var i = 0; i < words.length; i += chunkSize){
      var chunkWords = words.slice(i, i + chunkSize);
      var display = chunkWords.join(' ');
      var last = chunkWords[chunkWords.length - 1];
      seq.push({
        display: display,
        wordCount: chunkWords.length,
        isSingle: chunkSize === 1,
        endsPunct: /[.!?]$/.test(last),
        endsComma: /[,;:]$/.test(last)
      });
    }
    return { seq: seq, totalWords: words.length };
  }

  function msForEntry(entry, wpm){
    var base = 60000 / wpm;
    var ms = base * entry.wordCount;
    if (entry.isSingle && entry.display.length > 6){
      ms += Math.min((entry.display.length - 6) * 0.05 * base, base * 1.2);
    }
    if (entry.endsPunct) ms += base * 0.9;
    else if (entry.endsComma) ms += base * 0.4;
    return Math.max(ms, 45);
  }

  function renderEntry(entry){
    if (entry.isSingle){
      var parts = splitPivot(entry.display);
      els.wordDisplay.innerHTML =
        '<span class="pre">' + escapeHtml(parts.pre) + '</span>' +
        '<span class="pivot">' + escapeHtml(parts.pivot) + '</span>' +
        '<span class="post">' + escapeHtml(parts.post) + '</span>';
    } else {
      els.wordDisplay.innerHTML =
        '<span class="pre"></span>' +
        '<span class="pivot-plain">' + escapeHtml(entry.display) + '</span>' +
        '<span class="post"></span>';
    }
  }

  function pulseBeat(){
    els.beat.classList.remove('pulse');
    void els.beat.offsetWidth;
    els.beat.classList.add('pulse');
  }

  function updateProgress(){
    var pct = state.totalWords ? (state.wordsSoFar / state.totalWords * 100) : 0;
    els.progressFill.style.width = pct + '%';
    els.progressCount.textContent = state.wordsSoFar + ' / ' + state.totalWords + ' words';
  }

  function showScreen(name){
    state.screen = name;
    els.setupScreen.style.display = name === 'setup' ? 'block' : 'none';
    els.readerScreen.style.display = name === 'reader' ? 'block' : 'none';
    els.resultsScreen.style.display = name === 'results' ? 'block' : 'none';
    els.console.classList.toggle('is-hidden', name === 'results');
    els.chunkToggle.classList.toggle('is-disabled', name === 'reader');
    els.playBtn.setAttribute('aria-label', name === 'setup' ? 'Begin reading' : 'Play or pause');
  }

  function scheduleCurrent(){
    if (state.index >= state.sequence.length){
      finish();
      return;
    }
    var entry = state.sequence[state.index];
    state.wordsSoFar += entry.wordCount;
    renderEntry(entry);
    updateProgress();
    pulseBeat();
    var ms = msForEntry(entry, state.wpm);
    state.timerId = setTimeout(function(){
      state.index++;
      scheduleCurrent();
    }, ms);
  }

  function beginReading(){
    var built = buildSequence(els.textInput.value, state.chunkSize);
    if (built.seq.length === 0){
      els.textInput.focus();
      els.textInput.style.borderColor = 'var(--accent2)';
      setTimeout(function(){ els.textInput.style.borderColor = ''; }, 700);
      return;
    }
    state.sequence = built.seq;
    state.totalWords = built.totalWords;
    state.wordsSoFar = 0;
    state.index = 0;
    state.activeMs = 0;
    state.lastResume = performance.now();
    state.playing = true;
    showScreen('reader');
    els.playBtn.classList.add('is-playing');
    scheduleCurrent();
  }

  function pause(){
    if (!state.playing) return;
    clearTimeout(state.timerId);
    state.activeMs += performance.now() - state.lastResume;
    state.playing = false;
    els.playBtn.classList.remove('is-playing');
  }

  function resume(){
    if (state.playing || state.index >= state.sequence.length) return;
    state.lastResume = performance.now();
    state.playing = true;
    els.playBtn.classList.add('is-playing');
    scheduleCurrent();
  }

  function togglePlayPause(){
    if (state.playing) pause(); else resume();
  }

  function finish(){
    if (state.playing){
      state.activeMs += performance.now() - state.lastResume;
    }
    state.playing = false;
    els.playBtn.classList.remove('is-playing');
    var minutes = state.activeMs / 60000;
    var actualWpm = minutes > 0 ? Math.round(state.totalWords / minutes) : state.wpm;
    els.resultWpm.textContent = actualWpm;
    els.resultWords.textContent = state.totalWords;
    els.resultTime.textContent = formatDuration(minutes);
    showScreen('results');
  }

  function stopToSetup(){
    clearTimeout(state.timerId);
    state.playing = false;
    els.playBtn.classList.remove('is-playing');
    showScreen('setup');
    updateSetupMeta();
  }

  function newText(){
    els.textInput.value = '';
    stopToSetup();
    els.textInput.focus();
  }

  function readAgain(){
    stopToSetup();
  }

  // --- Events ---

  els.sampleSelect.addEventListener('change', function(){
    var key = els.sampleSelect.value;
    if (key && SAMPLE_TEXTS[key]){
      els.textInput.value = SAMPLE_TEXTS[key];
      updateSetupMeta();
    }
    els.sampleSelect.selectedIndex = 0;
    els.textInput.focus();
  });

  els.textInput.addEventListener('input', updateSetupMeta);

  els.wpmSlider.addEventListener('input', function(){
    state.wpm = parseInt(els.wpmSlider.value, 10);
    els.tempoValue.textContent = state.wpm;
    els.tempoName.textContent = tempoLabel(state.wpm);
    if (state.screen === 'setup') updateSetupMeta();
  });

  els.chunkButtons.forEach(function(btn){
    btn.addEventListener('click', function(){
      if (state.screen === 'reader') return;
      els.chunkButtons.forEach(function(b){ b.classList.remove('active'); });
      btn.classList.add('active');
      state.chunkSize = parseInt(btn.getAttribute('data-size'), 10);
    });
  });

  els.fontSelect.addEventListener('change', function(){
    els.body.classList.remove('font-sans', 'font-serif', 'font-lexend', 'font-dyslexic');
    els.body.classList.add('font-' + els.fontSelect.value);
  });

  els.playBtn.addEventListener('click', function(){
    if (state.screen === 'setup') beginReading();
    else if (state.screen === 'reader') togglePlayPause();
  });

  els.readAgainBtn.addEventListener('click', readAgain);
  els.newTextBtn.addEventListener('click', newText);

  document.addEventListener('keydown', function(e){
    if (e.code === 'Space' && state.screen === 'reader'){
      e.preventDefault();
      togglePlayPause();
    } else if (e.code === 'Escape' && (state.screen === 'reader' || state.screen === 'results')){
      stopToSetup();
    }
  });

  // --- Init ---
  updateSetupMeta();
  showScreen('setup');

})();
</script>

<style>
  body.font-sans{ --reading-font: var(--chrome); }
  body.font-serif{ --reading-font: var(--serif); }
  body.font-lexend{ --reading-font: 'Lexend', sans-serif; }
  body.font-dyslexic{ --reading-font: 'OpenDyslexic', sans-serif; }
</style>

</body>
